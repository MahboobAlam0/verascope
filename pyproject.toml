[project]
name = "gmc-document-intelligence"
version = "0.1.0"
description = "Automated extraction and structuring of Group Medical Cover (GMC) insurance policy documents."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
